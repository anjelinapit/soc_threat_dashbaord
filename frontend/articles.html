<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC DB Browser</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="articles-page">

<header id="articles-header">
    <div class="header-left">
        <div id="title">SOC DB BROWSER</div>
    </div>
    <div class="header-right">
        <span class="db-stats-label" id="db-total">0 articles</span>
        <a href="/" class="back-link">&larr; Dashboard</a>
    </div>
</header>

<div class="articles-layout">
    <div class="articles-main">
        <div class="toolbar">
            <input type="text" id="search-input" class="toolbar-input" placeholder="Search titles & descriptions...">
            <select id="filter-source" class="toolbar-select">
                <option value="">All Sources</option>
            </select>
            <select id="filter-vector" class="toolbar-select">
                <option value="">All Vectors</option>
            </select>
            <span class="toolbar-count" id="article-count">0 articles</span>
        </div>
        <div class="article-table-wrap" id="article-table-wrap">
            <div class="loading-text">Loading articles...</div>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <div class="articles-sidebar">
        <div class="sidebar-section">
            <div class="sidebar-header">STOP WORDS</div>
            <div class="sidebar-add">
                <input type="text" id="stop-word-input" class="sidebar-input" placeholder="Add stop word...">
                <button class="sidebar-btn" id="add-stop-word-btn">+</button>
            </div>
            <div class="sidebar-list" id="stop-words-list"></div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-header">ATTACK VECTOR KEYWORDS</div>
            <div class="sidebar-add">
                <input type="text" id="vector-name-input" class="sidebar-input" placeholder="New vector name...">
                <button class="sidebar-btn" id="add-vector-btn">+</button>
            </div>
            <div class="sidebar-list" id="vector-keywords-list"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <span>RECLASSIFY ARTICLE</span>
            <span class="modal-close" id="modal-close">&times;</span>
        </div>
        <div class="modal-body">
            <div class="modal-article-title" id="modal-article-title"></div>
            <div class="modal-vectors" id="modal-vectors"></div>
        </div>
        <div class="modal-footer">
            <button class="modal-btn" id="modal-save">Save</button>
            <button class="modal-btn modal-btn-cancel" id="modal-cancel">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="vector-modal-overlay" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <span id="vector-modal-title">EDIT KEYWORDS</span>
            <span class="modal-close" id="vector-modal-close">&times;</span>
        </div>
        <div class="modal-body">
            <textarea id="vector-modal-textarea" class="modal-textarea" rows="8"></textarea>
        </div>
        <div class="modal-footer">
            <button class="modal-btn" id="vector-modal-save">Save</button>
            <button class="modal-btn modal-btn-cancel" id="vector-modal-cancel">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="add-vector-modal-overlay" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <span>ADD NEW VECTOR</span>
            <span class="modal-close" id="add-vector-modal-close">&times;</span>
        </div>
        <div class="modal-body">
            <label style="font-family:var(--mono);font-size:10px;color:var(--text-dim);display:block;margin-bottom:4px;">Vector Name</label>
            <input type="text" id="add-vector-name" class="sidebar-input" style="width:100%;margin-bottom:10px;" placeholder="e.g. OT/ICS">
            <label style="font-family:var(--mono);font-size:10px;color:var(--text-dim);display:block;margin-bottom:4px;">Keywords (one per line)</label>
            <textarea id="add-vector-keywords" class="modal-textarea" rows="8" placeholder="scada&#10;plc&#10;siemens&#10;..."></textarea>
        </div>
        <div class="modal-footer">
            <button class="modal-btn" id="add-vector-modal-save">Create</button>
            <button class="modal-btn modal-btn-cancel" id="add-vector-modal-cancel">Cancel</button>
        </div>
    </div>
</div>

<script src="articles.js"></script>
</body>
</html>
